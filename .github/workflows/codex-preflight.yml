name: Codex fork preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit }}
      - run: swift build --build-system swiftbuild
      - run: |
          export PATH="$PATH:/usr/sbin"
          swift test --build-system swiftbuild
