name: Tart 1300 fork preflight

on:
  push:
    branches:
      - codex/tart-1300-preflight

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 133aaa64a97d2f8bfae3ed3d55c416c90e159b79
          fetch-depth: 4
          persist-credentials: false
      - name: Verify tested commit and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 133aaa64a97d2f8bfae3ed3d55c416c90e159b79
          test "$(git rev-parse HEAD^)" = 978599ac693263451a63bc029f0eca6a7f6ebddf
          test "$(git rev-parse HEAD^^^)" = 6fff37f0e0e2425b764a0c9902d90c7159103ab7
          sw_vers
          xcodebuild -version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: integration-tests/go.mod
          cache-dependency-path: integration-tests/go.sum
      - name: Build
        run: swift build --build-system swiftbuild
      - name: Run unit tests
        run: |
          export PATH="$PATH:/usr/sbin"
          swift test --build-system swiftbuild
      - name: Run OpenTelemetry integration tests
        run: |
          bin_path="$(swift build --build-system swiftbuild --show-bin-path)"
          codesign --sign - --entitlements Resources/tart-dev.entitlements --force "$bin_path/tart"
          cd integration-tests
          PATH="$bin_path:$PATH" go test -v ./...
