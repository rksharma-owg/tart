name: Tart 1300 fork preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
      - name: Build
        run: swift build --build-system swiftbuild
      - name: Run unit tests
        run: |
          export PATH="$PATH:/usr/sbin"
          swift test --build-system swiftbuild
